name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "assets/**"
      - "shared/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".gitmodules"
      - ".github/workflows/deploy.yml"
      - "!**/*.md"
      - "!**/*.test.*"
      - "!**/*.spec.*"
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AkaakuHub/game-portal
          ref: main
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Update registered games
        run: node scripts/updateGames.ts
      - name: Compute game build key
        id: game-key
        run: echo "key=$(node scripts/buildCache.ts)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build
          key: game-builds-${{ runner.os }}-${{ steps.game-key.outputs.key }}
          restore-keys: game-builds-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
